name: 버그
description: 동작하지 않거나 잘못된 결과
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 증상
      description: 무엇이 어떻게 잘못되는가
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
