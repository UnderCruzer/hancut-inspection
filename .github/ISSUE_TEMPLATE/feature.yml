name: 기능
description: 새 기능이나 실험
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 무엇을 만들고, 왜 필요한가
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 어떤 상태가 되면 닫을 수 있는가
      placeholder: |
        - [ ] ...
        - [ ] 테스트 추가
    validations:
      required: true
  - type: input
    id: week
    attributes:
      label: 주차
      placeholder: W2
